name: CI / CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ghcr.io/${{ github.repository }}/wordguesser-ci:${{ github.sha }}
          push: true

  rspec:
    name: RSpec Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run RSpec inside Docker
        run: |
          docker run --rm \
            -e RACK_ENV=test -e RAILS_ENV=test \
            -v "${{ github.workspace }}":/app \
            ghcr.io/${{ github.repository }}/wordguesser-ci:${{ github.sha }} \
            bash -lc "bundle exec rspec"
  cucumber:
    name: Cucumber Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Cucumber inside Docker
        run: |
          docker run --rm \
            -e RACK_ENV=test -e RAILS_ENV=test \
            -v ${{ github.workspace }}:/app \
            ghcr.io/${{ github.repository }}/wordguesser-ci:${{ github.sha }} \
            bash -lc "bundle exec cucumber"
name: CI / CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ghcr.io/${{ github.repository }}/wordguesser-ci:${{ github.sha }}
          push: true

  rspec:
    name: RSpec Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run RSpec inside Docker
        run: |
          docker run --rm \
            -e RACK_ENV=test -e RAILS_ENV=test \
            -v "${{ github.workspace }}":/app \
            ghcr.io/${{ github.repository }}/wordguesser-ci:${{ github.sha }} \
            bash -lc "bundle exec rspec"
  cucumber:
    name: Cucumber Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Cucumber inside Docker
        run: |
          docker run --rm \
            -e RACK_ENV=test -e RAILS_ENV=test \
            -v ${{ github.workspace }}:/app \
            ghcr.io/${{ github.repository }}/wordguesser-ci:${{ github.sha }} \
            bash -lc "bundle exec cucumber"
  lint:
    name: RuboCop Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RuboCop on lib/wordguesser_game.rb
        run: |
          bundle exec rubocop lib/wordguesser_game.rb --require rubocop-rspec -f json | tee rubocop.json

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Check offense threshold
        env:
          OFFENSE_THRESHOLD: "25"
        run: |
          COUNT=$(jq '.summary.offense_count' rubocop.json)
          echo "Found $COUNT offenses. Threshold: $OFFENSE_THRESHOLD"
          if [ "$COUNT" -gt "$OFFENSE_THRESHOLD" ]; then
            echo "::error::RuboCop offenses ($COUNT) exceed threshold ($OFFENSE_THRESHOLD)."
            exit 1
          fi
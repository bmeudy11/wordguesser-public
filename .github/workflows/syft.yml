name: Syft (SBOM Generation)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  syft-sbom:
    name: Generate SBOM with Syft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          # Install the official Syft binary
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOMs
        run: |
          # Generate multiple SBOM formats from the repository filesystem
          # cyclonedx JSON
          syft dir:. -o cyclonedx-json > sbom.cyclonedx.json || true
          # SPDX JSON
          syft dir:. -o spdx-json > sbom.spdx.json || true
          # native syft JSON
          syft dir:. -o json > sbom.syft.json || true

      - name: Show SBOM summaries (short)
        run: |
          echo "CycloneDX SBOM size:" && wc -c sbom.cyclonedx.json || true
          echo "SPDX SBOM size:" && wc -c sbom.spdx.json || true
          echo "Syft JSON SBOM size:" && wc -c sbom.syft.json || true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
            sbom.syft.json

      - name: (Optional) Fail if no packages found
        if: false
        run: |
          # Exit with non-zero if syft finds no packages (adjust as needed)
          if [ ! -s sbom.syft.json ]; then
            echo "No SBOM generated, failing job"; exit 1
          fi

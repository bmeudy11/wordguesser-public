name: RuboCop (Security-Focused Static Code Analysis)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rubocop-scan:
    name: RuboCop security analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Match the Ruby version in the project's Gemfile (~> 3.3.8)
          ruby-version: 3.3.8
          bundler-cache: true

      - name: Show Ruby and Bundler versions (debug)
        run: |
          ruby --version
          gem --version
          bundle --version || true

      - name: Install RuboCop security gem
        run: |
          # Install rubocop-security globally so it can be required by rubocop
          gem install rubocop-security

      - name: Ensure bundle dependencies
        run: |
          # Explicit install to make sure development/test gems (like rubocop) are present
          bundle install --jobs 4 --retry 3

      - name: Run RuboCop with security focus
        run: |
          # Use bundle exec when possible so project Gemfile gems are used
          bundle exec rubocop --require rubocop-security --format json --out rubocop.json || true
          bundle exec rubocop --require rubocop-security --format progress || true

      - name: Upload RuboCop results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubocop-results
          path: rubocop.json

      - name: Comment PR with RuboCop results (optional)
        if: github.event_name == 'pull_request'
        run: |
          # Parse JSON and comment on PR with results (requires additional setup)
          # For now, results are available in artifacts
          echo "RuboCop results saved to artifacts"
